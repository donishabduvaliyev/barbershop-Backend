version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartchair-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - TZ=Asia/Tashkent
      - MONGO_URI=mongodb://mongo:27017/barbershop
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SHOP_CONTROL_BOT_TOKEN=${SHOP_CONTROL_BOT_TOKEN}
      - DISABLE_TELEGRAM_POLLING=${DISABLE_TELEGRAM_POLLING:-false}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - smartchair-net

  mongo:
    image: mongo:7.0-jammy
    container_name: smartchair-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smartchair-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local

networks:
  smartchair-net:
    driver: bridge
